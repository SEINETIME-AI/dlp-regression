title: Keyword secrecy — the higher level wins, several domains at once

# Created once and kept: documents in the inventory keep referring to them.
document_types:
  - code: uat-finance
    name: UAT Tài chính
  - code: uat-hr
    name: UAT Nhân sự

policy:
  name: UAT 01 keyword secrecy
  conditions:
    - name: UAT nội bộ
      secrecy: confidential
      keyword: nội bộ
    - name: UAT tuyệt mật
      secrecy: secret
      keyword: tuyệt mật
    - name: UAT phiếu chi
      document_type: uat-finance
      keyword: phiếu chi
    - name: UAT bảng lương
      document_type: uat-hr
      keyword: bảng lương

# Files in data/01-keyword-secrecy and what the agent must decide for each.
expected:
  bao-cao-quy.docx:
    secrecy: secret          # matches both secrecy conditions; secret outranks confidential
    domains: [uat-finance, uat-hr]
  de-xuat.docx:
    secrecy: confidential
    domains: [uat-finance]
