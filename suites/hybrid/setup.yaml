title: Hybrid — rules that need several signals at once

# Triggers stay clear of the classification suite and of the department's real
# policy: hóa đơn / thuế / phí / số tiền, "quý 1"/"quý 2", and long digit runs.

document_types:
  - code: uat-project
    name: UAT Dự án

policies:
  - name: UAT hybrid
    conditions:
      # Keyword AND data pattern: the phrase alone or the code alone is not enough.
      - name: UAT mã dự án
        document_type: uat-project
        hybrid:
          combinator: all
          conditions:
            - keyword: mã dự án
            - data_pattern: 'DA-[A-Z]{4}'
      # Wordlist: each term weighs 0.5 against a threshold of 1, so two terms fire it.
      - name: UAT hạ tầng mạng
        secrecy: secret
        hybrid:
          combinator: all
          conditions:
            - wordlist: [sơ đồ mạng, tường lửa, máy chủ]
