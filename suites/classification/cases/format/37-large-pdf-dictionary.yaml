title: A 22 MB PDF fires a dictionary rule from its first and last pages (TC-H-03)

# "hợp tác xã" on page 1, "nông sản" on page 3; a noise image on page 2 makes the size.
# A PDF over 20 MB is read for its text layer only (no OCR), so its pages are flagged unread and
# the agent policy's floor gives it "Pending review" until scan pages are told apart in the lab.
expected:
  bien-ban-22mb.pdf:
    secrecy: pending_review
    domains: [uat-nong-san]
    coverage: partial
