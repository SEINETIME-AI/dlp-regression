# Anti-uninstall protection, the laptop part: the Console's uninstall password, the hash an agent
# gets on heartbeat and in its installer, and the machine events an agent reports. The agent is
# played over gRPC (harness/simulated_agent.py); installing, uninstalling and the service lock are
# checked on the test VM. The cases build on each other and run in this order; cleanup always runs.
cases:
  - name: precondition-no-password
    title: No uninstall password is set before the run (a set one could not be restored)
    check: precondition_no_password
  - name: console-set-password
    title: The System page blocks a blank or short password and sets a Vietnamese one without showing it again
    check: console_set_password
  - name: heartbeat-carries-hash
    title: An enrolled agent gets the PBKDF2 hash of that password on heartbeat
    check: heartbeat_carries_hash
  - name: machine-events-on-endpoints
    title: uninstall_denied and agent_unclean_stop show on Máy trạm (flag, filter, drawer) and as admin notifications, not in the classification timeline
    check: machine_events_on_endpoints
  - name: package-msi-carries-hash
    title: A package built after the password was set carries its hash in UNINSTALL_PASSWORD_HASH
    check: package_msi_carries_hash
  - name: console-clear-password
    title: Clearing the password asks first, then heartbeat sends an empty hash and a rebuilt package none
    check: console_clear_password
  - name: cleanup
    title: The password is cleared and the UAT unit, package and machine are gone
    check: cleanup
